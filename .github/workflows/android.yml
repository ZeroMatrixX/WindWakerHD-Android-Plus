name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Tools
        run: |
          sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "ninja"
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build Android Project
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-30 \
                -DCMAKE_BUILD_TYPE=Release \
                -G Ninja ..
          ninja

      - name: Build APK via Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WindWakerHD-RTL-APK
          path: |
            build/*.apk
            android/app/build/outputs/apk/release/*.apk
